<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAM Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1c2330; --muted: #667085; --line: #e3e6ec;
    --accent: #2f5fd0; --accent-ink: #ffffff;
    --ok: #17803d; --ok-bg: #e3f5e9; --warn: #a15c00; --warn-bg: #fff1d6;
    --bad: #b42318; --bad-bg: #fde8e6; --info: #3b4fa0; --info-bg: #e8ecfb; --grey-bg: #eceef2;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --panel: #1b212b; --ink: #e8ebf1; --muted: #98a2b3; --line: #2b3342;
      --accent: #6b93f2; --accent-ink: #0d1117;
      --ok: #5fd08a; --ok-bg: #173324; --warn: #f2b559; --warn-bg: #3a2c12;
      --bad: #ff8a7d; --bad-bg: #3d1b18; --info: #9fb0f5; --info-bg: #1f2747; --grey-bg: #262d3a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1200px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 16px;
         align-items: center; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  h1 small { font-weight: 400; color: var(--muted); margin-left: 8px; }
  .spacer { flex: 1; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.up { background: var(--ok); } .dot.down { background: var(--bad); }
  main { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
          box-shadow: var(--shadow); cursor: default; text-align: left; font: inherit; color: inherit; }
  button.card { cursor: pointer; }
  button.card:hover { border-color: var(--accent); }
  .card .n { font-size: 28px; font-weight: 650; letter-spacing: -.02em; }
  .card .l { color: var(--muted); font-size: 13px; }
  .card.bad .n { color: var(--bad); } .card.warn .n { color: var(--warn); }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px;
               font: inherit; color: var(--muted); cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .tools { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
          border-radius: 7px; padding: 7px 10px; min-width: 0; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 7px;
         padding: 7px 12px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 3px 8px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--grey-bg); }
  td.mono, .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
           background: var(--grey-bg); color: var(--muted); margin: 1px 4px 1px 0; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); } .badge.info { background: var(--info-bg); color: var(--info); }
  .empty, .loading { padding: 28px; text-align: center; color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .banner { border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; background: var(--bad-bg); color: var(--bad); }
  .banner ul { margin: 6px 0 0; padding-left: 18px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--ink);
           width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(10,14,20,.5); }
  .dhead { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dhead h2 { margin: 0; font-size: 16px; flex: 1; }
  .dbody { padding: 16px 18px; overflow-y: auto; max-height: calc(100vh - 150px); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
  label input, label select { width: 100%; margin-top: 3px; font-weight: 400; color: var(--ink); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  section.box { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; margin-top: 14px; }
  section.box h3 { margin: 0 0 8px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .ent { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .ent:last-child { border-bottom: 0; } .ent .name { flex: 1; }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 10; }
  .toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; max-width: 360px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .toast.bad { background: var(--bad); color: #fff; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>IAM Dashboard <small>Identity lifecycle &amp; RBAC</small></h1>
    <div class="spacer"></div>
    <label style="margin:0;display:flex;align-items:center;gap:6px;white-space:nowrap">Acting as
      <input id="actor" value="dashboard" size="12" aria-label="Actor recorded in the audit log" style="margin:0">
    </label>
    <div class="status"><span class="dot" id="healthDot"></span><span id="healthText">checking…</span></div>
    <button class="btn primary" id="hireBtn">+ Hire (Joiner)</button>
  </div>
</header>

<main>
  <div class="cards" id="cards"></div>

  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="employees" aria-selected="true">Employees</button>
    <button role="tab" data-tab="access" aria-selected="false">Access report</button>
    <button role="tab" data-tab="sod" aria-selected="false">SoD violations</button>
    <button role="tab" data-tab="excessive" aria-selected="false">Excessive access</button>
    <button role="tab" data-tab="audit" aria-selected="false">Audit log</button>
  </nav>

  <div id="view"></div>
</main>

<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>

<datalist id="deptList"></datalist>
<datalist id="entList"></datalist>
<datalist id="supList"></datalist>

<script>
"use strict";
const API = "api";
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const state = { tab: "employees", employees: [], sod: null, excessive: null, access: null,
                audit: null, filter: "", status: "ALL", auditEmp: "", auditLimit: 50, openId: null };

/* ---------- API ---------- */
async function call(method, path, body) {
  const opts = { method, headers: { "X-Actor": $("#actor").value.trim() || "dashboard" } };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(API + path, opts); }
  catch (e) { throw Object.assign(new Error("Cannot reach the API. Is Tomcat running on port 8081?"), { status: 0 }); }
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch (e) { /* not JSON */ }
  if (!res.ok) throw Object.assign(new Error((data && data.error) || "HTTP " + res.status), { status: res.status, data });
  return data;
}

function toast(msg, bad) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3500);
}

/* ---------- helpers ---------- */
const statusBadge = s => `<span class="badge ${s === "ACTIVE" ? "ok" : "grey"}">${esc(s)}</span>`;
const sourceBadge = s => `<span class="badge ${s === "ROLE" ? "info" : "warn"}">${esc(s)}</span>`;
const findingBadge = t => `<span class="badge ${t === "TERMINATED_WITH_ACCESS" ? "bad" : "warn"}">${esc(t)}</span>`;
const fmtTime = t => esc(String(t ?? "").replace("T", " ").slice(0, 19));
const nameOf = id => { const e = state.employees.find(x => x.id === id); return e ? `${e.givenName} ${e.familyName}` : ""; };
const empLink = id => `<a href="#" class="mono" data-open="${esc(id)}">${esc(id)}</a>`;

function fillLists() {
  const uniq = a => [...new Set(a.filter(Boolean))].sort();
  $("#deptList").innerHTML = uniq(state.employees.map(e => e.department)).map(d => `<option value="${esc(d)}">`).join("");
  $("#supList").innerHTML = state.employees.filter(e => e.status === "ACTIVE")
      .map(e => `<option value="${esc(e.id)}">${esc(e.givenName + " " + e.familyName)}</option>`).join("");
  if (state.access) {
    const ents = uniq(state.access.flatMap(r => r.entitlements.map(x => x.name)));
    $("#entList").innerHTML = ents.map(n => `<option value="${esc(n)}">`).join("");
  }
}

/* ---------- data loading ---------- */
async function loadSummary() {
  const [emps, sod, exc] = await Promise.all([call("GET", "/employees"), call("GET", "/reports/sod"), call("GET", "/reports/excessive")]);
  state.employees = emps; state.sod = sod; state.excessive = exc;
  fillLists(); renderCards();
}
async function loadAccess() { state.access = await call("GET", "/reports/access?format=json"); fillLists(); }
async function loadAudit() {
  let q = "?limit=" + encodeURIComponent(state.auditLimit);
  if (state.auditEmp.trim()) q = "?employeeId=" + encodeURIComponent(state.auditEmp.trim());
  state.audit = await call("GET", "/audit" + q);
}
async function refreshAll() {
  state.access = null; state.audit = null;
  await loadSummary();
  await showTab(state.tab);
}

async function checkHealth() {
  try { await call("GET", "/health"); $("#healthDot").className = "dot up"; $("#healthText").textContent = "API online"; return true; }
  catch (e) { $("#healthDot").className = "dot down"; $("#healthText").textContent = "API offline"; return false; }
}

/* ---------- rendering ---------- */
function renderCards() {
  const active = state.employees.filter(e => e.status === "ACTIVE").length;
  const termAccess = state.excessive.findings.filter(f => f.type === "TERMINATED_WITH_ACCESS").length;
  const other = state.excessive.count - termAccess;
  const card = (n, l, cls, tab) => `<${tab ? "button" : "div"} class="card ${cls || ""}" ${tab ? `data-tab-go="${tab}"` : ""}>
      <div class="n">${n}</div><div class="l">${l}</div></${tab ? "button" : "div"}>`;
  $("#cards").innerHTML =
    card(active, "Active employees", "", "employees") +
    card(state.employees.length - active, "Terminated", "", "employees") +
    card(state.sod.count, "SoD violations", state.sod.count ? "bad" : "", "sod") +
    card(termAccess, "Terminated, still has access", termAccess ? "bad" : "", "excessive") +
    card(other, "Other access findings", other ? "warn" : "", "excessive");
}

function table(head, rows, rowAttr) {
  if (!rows.length) return `<div class="tablewrap"><div class="empty">Nothing to show.</div></div>`;
  return `<div class="tablewrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr ${rowAttr ? rowAttr(r) : ""}>${r.cells.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function viewEmployees() {
  const f = state.filter.toLowerCase();
  const list = state.employees.filter(e =>
      (state.status === "ALL" || e.status === state.status) &&
      (!f || [e.id, e.givenName, e.familyName, e.department, e.jobTitle, e.email].join(" ").toLowerCase().includes(f)));
  const rows = list.map(e => ({ id: e.id, cells: [
      `<span class="mono">${esc(e.id)}</span>`, esc(e.givenName + " " + e.familyName), esc(e.department),
      esc(e.jobTitle), statusBadge(e.status), esc(e.joinedOn ?? ""), esc(e.exitedOn ?? "")] }));
  return `<div class="tools">
      <input id="search" type="search" placeholder="Search name, id, department…" value="${esc(state.filter)}" style="min-width:260px">
      <select id="statusSel">${["ALL","ACTIVE","TERMINATED"].map(s => `<option ${s === state.status ? "selected" : ""}>${s}</option>`).join("")}</select>
      <span class="note" style="margin:0">${list.length} of ${state.employees.length}. Click a row to manage an employee.</span></div>` +
    table(["ID","Name","Department","Title","Status","Joined","Exited"], rows, r => `class="click" data-open="${esc(r.id)}"`);
}

function viewAccess() {
  const rows = state.access.map(r => ({ cells: [
      empLink(r.employeeId), esc(r.name), esc(r.department), statusBadge(r.status),
      r.roles.map(x => `<span class="badge info">${esc(x)}</span>`).join("") || "<span class='note'>none</span>",
      r.entitlements.map(x => `<span class="badge ${x.source === "ROLE" ? "" : "warn"}" title="${esc(x.source)}">${esc(x.name)}</span>`).join("") || "<span class='note'>none</span>"] }));
  return `<div class="tools"><p class="note" style="margin:0">Who has access to what. Amber entitlements were granted directly, outside the role model.</p>
      <div class="spacer"></div><a class="btn" href="${API}/reports/access" download="access-report.csv">Download CSV</a></div>` +
    table(["ID","Name","Department","Status","Roles","Entitlements"], rows);
}

function viewSod() {
  const v = state.sod.violations;
  return `<p class="note">Employees who hold a forbidden combination of entitlements.</p>` +
    table(["Employee","Name","Conflict","Why it matters"], v.map(x => ({ cells: [
      empLink(x.employeeId), esc(nameOf(x.employeeId)),
      `<span class="badge bad">${esc(x.entitlementA)}</span> + <span class="badge bad">${esc(x.entitlementB)}</span>`, esc(x.description)] })));
}

function viewExcessive() {
  const f = state.excessive.findings;
  return `<p class="note">Direct access outside roles, entitlements not covered by any role, and terminated employees who still hold access.</p>` +
    table(["Employee","Name","Finding","Detail"], f.map(x => ({ cells: [
      empLink(x.employeeId), esc(nameOf(x.employeeId)), findingBadge(x.type), esc(x.detail)] })));
}

function viewAudit() {
  const e = state.audit.entries;
  return `<div class="tools">
      <input id="auditEmp" placeholder="Filter by employee id" value="${esc(state.auditEmp)}">
      <select id="auditLimit" ${state.auditEmp.trim() ? "disabled" : ""}>${[20,50,100,500].map(n => `<option ${n === state.auditLimit ? "selected" : ""}>${n}</option>`).join("")}</select>
      <button class="btn" id="auditGo">Apply</button>
      <span class="note" style="margin:0">${e.length} entries, newest first. The log is append-only.</span></div>` +
    table(["Time","Employee","Action","Target","By","Reason"], e.map(x => ({ cells: [
      `<span class="mono">${fmtTime(x.timestamp)}</span>`, x.employeeId ? empLink(x.employeeId) : "",
      `<span class="badge ${/BLOCK|REVOKE|TERMINATE/i.test(x.action) ? "bad" : "info"}">${esc(x.action)}</span>`,
      esc(x.target), esc(x.performedBy), esc(x.reason)] })));
}

async function showTab(tab) {
  state.tab = tab;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  const view = $("#view");
  try {
    if (tab === "access" && !state.access) { view.innerHTML = `<div class="loading">Loading…</div>`; await loadAccess(); }
    if (tab === "audit" && !state.audit) { view.innerHTML = `<div class="loading">Loading…</div>`; await loadAudit(); }
    view.innerHTML = { employees: viewEmployees, access: viewAccess, sod: viewSod, excessive: viewExcessive, audit: viewAudit }[tab]();
  } catch (e) { view.innerHTML = `<div class="banner">${esc(e.message)}</div>`; }
  const s = $("#search"); if (s) { s.addEventListener("input", () => { state.filter = s.value; rerenderKeepFocus(); }); }
  const ss = $("#statusSel"); if (ss) ss.addEventListener("change", () => { state.status = ss.value; $("#view").innerHTML = viewEmployees(); showTab("employees"); });
  const ag = $("#auditGo"); if (ag) ag.addEventListener("click", async () => {
    state.auditEmp = $("#auditEmp").value; state.auditLimit = +$("#auditLimit").value;
    try { await loadAudit(); showTab("audit"); } catch (e) { toast(e.message, true); }
  });
  const ae = $("#auditEmp"); if (ae) ae.addEventListener("keydown", ev => { if (ev.key === "Enter") $("#auditGo").click(); });
}

function rerenderKeepFocus() {
  const pos = $("#search").selectionStart;
  $("#view").innerHTML = viewEmployees();
  const s = $("#search");
  s.addEventListener("input", () => { state.filter = s.value; rerenderKeepFocus(); });
  $("#statusSel").addEventListener("change", () => { state.status = $("#statusSel").value; showTab("employees"); });
  s.focus(); s.setSelectionRange(pos, pos);
}

/* ---------- dialogs ---------- */
const dlg = $("#dlg");
function openDialog(title, html) {
  dlg.innerHTML = `<div class="dhead"><h2>${title}</h2><button class="btn small" data-close aria-label="Close">Close</button></div><div class="dbody">${html}</div>`;
  if (!dlg.open) dlg.showModal();
}
function errorBanner(e) {
  const v = e.data && e.data.violations;
  return `<div class="banner" role="alert"><strong>${e.status === 409 ? "Blocked: " : ""}${esc(e.message)}</strong>${
    v && v.length ? `<ul>${v.map(x => `<li>${esc(x.entitlementA)} + ${esc(x.entitlementB)}: ${esc(x.description)}</li>`).join("")}</ul>` : ""}</div>`;
}
function showFormError(e) { const box = $("#formErr"); if (box) box.innerHTML = errorBanner(e); else toast(e.message, true); }

function hireForm() {
  openDialog("Hire a new employee (Joiner)", `<form id="hireForm"><div id="formErr"></div><div class="grid">
    <label>Employee ID<input name="employeeId" required maxlength="20" placeholder="e.g. T100"></label>
    <label>Email<input name="email" type="email" placeholder="name@lab-corp.test"></label>
    <label>Given name<input name="givenName" required></label>
    <label>Family name<input name="familyName" required></label>
    <label>Department<input name="department" required list="deptList"></label>
    <label>Job title<input name="jobTitle" required></label>
    <label class="full">Supervisor ID (optional)<input name="supervisorId" list="supList"></label></div>
    <p class="note" style="margin-top:12px">Roles and entitlements are assigned automatically from the department and title rules.</p>
    <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Hire</button></div></form>`);
  $("#hireForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const body = Object.fromEntries(new FormData(ev.target));
    Object.keys(body).forEach(k => { body[k] = body[k].trim(); if (!body[k]) delete body[k]; });
    try { const r = await call("POST", "/employees", body); toast(`Hired ${body.employeeId} with ${r.roles.length} role(s)`); await refreshAll(); await openEmployee(body.employeeId); }
    catch (e) { showFormError(e); }
  });
}

async function openEmployee(id) {
  state.openId = id;
  try { renderEmployee(await call("GET", "/employees/" + encodeURIComponent(id))); }
  catch (e) { toast(e.message, true); }
}

function renderEmployee(d, errHtml) {
  const e = d.employee, active = e.status === "ACTIVE";
  const ents = d.entitlements.length ? d.entitlements.map(x => `<div class="ent"><span class="name mono">${esc(x.name)}</span>${sourceBadge(x.source)}${
      x.source === "DIRECT" && active ? `<button class="btn small danger" data-revoke="${esc(x.name)}">Revoke</button>` : ""}</div>`).join("") : `<span class="note">No entitlements.</span>`;
  openDialog(`${esc(e.givenName + " " + e.familyName)} <span class="mono" style="color:var(--muted)">${esc(e.id)}</span>`, `
    <div id="formErr">${errHtml || ""}</div>
    <dl class="kv"><dt>Status</dt><dd>${statusBadge(e.status)}</dd><dt>Department</dt><dd>${esc(e.department)}</dd>
      <dt>Title</dt><dd>${esc(e.jobTitle)}</dd><dt>Email</dt><dd>${esc(e.email)}</dd>
      <dt>Supervisor</dt><dd>${e.supervisorId ? empLink(e.supervisorId) + " " + esc(nameOf(e.supervisorId)) : "none"}</dd>
      <dt>Joined</dt><dd>${esc(e.joinedOn)}</dd>${e.exitedOn ? `<dt>Exited</dt><dd>${esc(e.exitedOn)}</dd>` : ""}
      <dt>Roles</dt><dd>${d.roles.map(r => `<span class="badge info">${esc(r)}</span>`).join("") || "none"}</dd></dl>
    <section class="box"><h3>Entitlements</h3>${ents}</section>
    ${active ? `
    <section class="box"><h3>Grant a direct entitlement (SoD-checked)</h3>
      <form id="grantForm" class="grid"><label>Entitlement<input name="entitlement" required list="entList" placeholder="e.g. JIRA_ACCESS"></label>
        <label>Reason<input name="reason" placeholder="optional"></label>
        <div class="full actions" style="margin:0"><button class="btn primary">Grant</button></div></form></section>
    <section class="box"><h3>Move (Mover)</h3>
      <form id="moveForm" class="grid"><label>New department<input name="department" required list="deptList" value="${esc(e.department)}"></label>
        <label>New job title<input name="jobTitle" required value="${esc(e.jobTitle)}"></label>
        <div class="full actions" style="margin:0"><button class="btn primary">Move</button></div></form></section>
    <section class="box"><h3>Leave (Leaver)</h3>
      <p class="note">Revokes every entitlement and marks the employee TERMINATED. This cannot be undone.</p>
      <button class="btn danger" id="leaveBtn">Terminate ${esc(e.id)}</button></section>` : `<p class="note">Terminated employees can't be changed.</p>`}
    <section class="box"><h3>Recent audit</h3><div id="empAudit" class="note">Loading…</div></section>`);
  loadEmpAudit(e.id);
  const g = $("#grantForm"), m = $("#moveForm"), l = $("#leaveBtn");
  if (g) g.addEventListener("submit", async ev => { ev.preventDefault(); const b = Object.fromEntries(new FormData(g));
    if (!b.reason.trim()) delete b.reason;
    try { renderEmployee(await call("POST", `/employees/${encodeURIComponent(e.id)}/entitlements`, b)); toast("Granted " + b.entitlement); afterChange(); }
    catch (err) { renderEmployee(d, errorBanner(err)); if (err.status === 409) { afterChange(); } } });
  if (m) m.addEventListener("submit", async ev => { ev.preventDefault();
    try { renderEmployee(await call("POST", `/employees/${encodeURIComponent(e.id)}/move`, Object.fromEntries(new FormData(m)))); toast("Moved " + e.id); afterChange(); }
    catch (err) { renderEmployee(d, errorBanner(err)); } });
  if (l) l.addEventListener("click", async () => {
    if (!confirm(`Terminate ${e.id} and revoke all access?`)) return;
    try { renderEmployee(await call("POST", `/employees/${encodeURIComponent(e.id)}/leave`, {})); toast(e.id + " terminated"); afterChange(); }
    catch (err) { renderEmployee(d, errorBanner(err)); } });
}

async function loadEmpAudit(id) {
  try {
    const r = await call("GET", "/audit?employeeId=" + encodeURIComponent(id));
    const box = $("#empAudit"); if (!box) return;
    box.className = "";
    box.innerHTML = r.entries.length ? `<table><tbody>${r.entries.slice(0, 8).map(x =>
      `<tr><td class="mono">${fmtTime(x.timestamp)}</td><td>${esc(x.action)}</td><td>${esc(x.target)}</td></tr>`).join("")}</tbody></table>` : `<span class="note">No entries.</span>`;
  } catch (e) { /* non-critical */ }
}

async function afterChange() { state.access = null; state.audit = null; try { await loadSummary(); await showTab(state.tab); } catch (e) { toast(e.message, true); } }

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-open],[data-close],[data-revoke],[data-tab-go]");
  if (!t) return;
  if (t.hasAttribute("data-close")) { dlg.close(); return; }
  if (t.dataset.tabGo) { ev.preventDefault(); showTab(t.dataset.tabGo); return; }
  if (t.dataset.open) { ev.preventDefault(); openEmployee(t.dataset.open); return; }
  if (t.dataset.revoke) {
    const id = state.openId, name = t.dataset.revoke;
    if (!confirm(`Revoke ${name} from ${id}?`)) return;
    try { renderEmployee(await call("DELETE", `/employees/${encodeURIComponent(id)}/entitlements/${encodeURIComponent(name)}?reason=${encodeURIComponent("revoked from dashboard")}`)); toast("Revoked " + name); afterChange(); }
    catch (e) { toast(e.message, true); }
  }
});
dlg.addEventListener("click", ev => { if (ev.target === dlg) dlg.close(); });
$("#tabs").addEventListener("click", ev => { const b = ev.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
$("#hireBtn").addEventListener("click", hireForm);

(async function init() {
  $("#view").innerHTML = `<div class="loading">Loading…</div>`;
  if (!(await checkHealth())) { $("#view").innerHTML = `<div class="banner">Cannot reach the API at <span class="mono">${esc(location.origin)}/iam-api/api</span>. Start Tomcat with start-iam-api.bat and reload.</div>`; return; }
  try { await loadSummary(); await showTab("employees"); await loadAccess(); }
  catch (e) { $("#view").innerHTML = `<div class="banner">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
